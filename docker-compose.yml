services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/highways').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
