<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santiago TAG Calculator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h1>TAG Calculator</h1>
            <p class="subtitle">Estimador de peajes en Santiago</p>

            <div class="form-group input-wrap">
                <label for="origin">Origen</label>
                <div class="input-with-actions">
                    <input type="text" id="origin" placeholder="Ej: Mall Plaza Vespucio" autocomplete="off" />
                    <button type="button" class="input-action-btn" id="geolocate-btn" title="Usar mi ubicacion">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="1" x2="8" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="12" x2="8" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="8" x2="4" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <div class="suggestions-dropdown hidden" id="origin-suggestions"></div>
            </div>

            <button type="button" class="swap-btn" id="swap-btn" title="Intercambiar origen y destino">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 2L4 14M4 14L1 11M4 14L7 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 14L12 2M12 2L9 5M12 2L15 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

            <div class="form-group input-wrap">
                <label for="destination">Destino</label>
                <div class="input-with-actions">
                    <input type="text" id="destination" placeholder="Ej: Aeropuerto Santiago" autocomplete="off" />
                </div>
                <div class="suggestions-dropdown hidden" id="destination-suggestions"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="departure">Hora de salida</label>
                    <input type="datetime-local" id="departure" />
                </div>
                <div class="form-group">
                    <label for="vehicle">Vehiculo</label>
                    <select id="vehicle">
                        <option value="cat_4" selected>Auto / Camioneta</option>
                        <option value="cat_1">Moto</option>
                        <option value="cat_2">Bus / Camion</option>
                        <option value="cat_3">Camion c/ remolque</option>
                    </select>
                </div>
            </div>

            <button id="calculate-btn" onclick="compareRoutes()">Comparar Rutas</button>

            <div id="results" class="hidden">
                <div id="routes-container"></div>
            </div>

            <div id="error" class="hidden"></div>

            <div class="tip">
                <strong>Tip:</strong> Haz clic en el mapa para fijar origen (1er clic) y destino (2do clic).
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
